# Render Blueprint Specification for Wallet-Mate
# Docs: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. Node.js Backend API Service (MongoDB Atlas + JWT Auth)
  # -------------------------------------------------------------
  - type: web
    name: wallet-mate-backend
    runtime: node
    rootDir: backend/api
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false

  # -------------------------------------------------------------
  # 2. Python FastAPI AI Service (Stock Predictions & AI Mentor)
  # -------------------------------------------------------------
  - type: web
    name: wallet-mate-ai
    runtime: python
    rootDir: ai-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false

  # -------------------------------------------------------------
  # 3. React Single Page Application (Static Site CDN)
  # -------------------------------------------------------------
  - type: web
    name: wallet-mate-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_AI_API_URL
        sync: false
